[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "keli-live"
version = "0.1.0"
description = "Live road-surface conditions for every Finnish road camera, read by a vision model trained on roadside sensors."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saurabh Bhadane" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime dependencies are added with the first module that needs them (see CLAUDE.md: ask first).
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
    "pre-commit>=4.3,<5",
]
# One-off feasibility scripts in scripts/ (synchronous, not part of the package).
scripts = ["requests>=2.32,<3"]

[project.urls]
Repository = "https://github.com/SaurabhDB/keli-live"

[tool.setuptools.packages.find]
include = ["keli*"]

[tool.setuptools.package-data]
keli = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["test_scripts", "*.md"]  # keep hand-aligned pseudocode in docs

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "RET", "ARG",
          "PTH", "PL", "RUF", "S", "ASYNC", "DTZ", "T20", "ERA", "PT", "TRY", "D"]
ignore = ["D203", "D213", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG"]
"scripts/**" = ["T20", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["keli", "tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=keli --cov-report=term-missing --cov-fail-under=85 -m 'not contract'"
markers = ["contract: hits the live Digitraffic API", "slow: long-running"]

[tool.coverage.run]
branch = true
omit = ["keli/models/train.py"]
